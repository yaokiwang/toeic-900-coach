<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TOEIC 900 智慧單字教練</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,-apple-system,sans-serif}
    #app{max-width:430px;min-height:100dvh;margin:auto;background:#111827;padding:20px 20px 90px}
    h1{text-align:center;font-size:24px}h2{font-size:20px}h3{font-size:17px;margin-top:0}
    .card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:20px;margin:18px 0}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button,.upload{border:0;border-radius:12px;padding:14px;color:#fff;background:#374151;font:inherit;cursor:pointer;text-align:center}
    button:disabled{opacity:.45;cursor:default}.primary{background:#2563eb}.green{background:#16a34a}.wide{width:100%;margin:5px 0}
    input:not([type=file]){width:100%;padding:13px;border-radius:10px;background:#111827;border:1px solid #6b7280;color:white;font:inherit}
    small,.muted{color:#9ca3af}.error{color:#fecaca}.bar{height:8px;background:#374151;border-radius:8px;overflow:hidden;margin:8px 0 20px}.fill{height:100%;background:#3b82f6}
    .choice{display:block;width:100%;margin:10px 0;border:1px solid #4b5563;text-align:left}.right{background:#14532d;border-color:#22c55e}.wrong{background:#7f1d1d;border-color:#ef4444}
    .question{text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .question strong{font-size:36px}.question p{font-size:20px;line-height:1.5}
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;background:#111827;border-top:1px solid #374151;padding:8px 8px max(12px,env(safe-area-inset-bottom))}
    nav button{background:none;padding:8px;color:#9ca3af}nav button.active{color:#60a5fa}.notice{line-height:1.6}.hidden{display:none}
  </style>
</head>
<body><main id="app"></main>
<script>
(() => {
  'use strict';
  const API_BASE='https://generativelanguage.googleapis.com/v1beta/models/';
  const MODEL={id:'gemini-3.5-flash-lite',label:'3.5 Flash-Lite',timeout:30000};
  const KEY='toeic900_v2', oldKey='gemini_api_key', app=document.getElementById('app');
  const LEVELS={750:'常見 TOEIC 商務字詞；清楚且自然的職場例句；干擾選項意義明顯不同。',800:'較進階的商務與行政字詞；包含合約、營運或人事情境；干擾選項應合理但意思不同。',850:'進階商務字詞與常見抽象用法；例句呈現上下文線索；干擾選項語意相近但只有一個正解。',900:'高階但實用的 TOEIC 商務字詞與精細語意；避免冷僻詞；例句須能明確區分相近選項。'};
  const day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const defaults=()=>({vocab:[],difficulty:750,progress:{date:day(),newWords:0,reviews:0},quiz:null,history:[],lastLevelChangeAt:null});
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lemma=s=>String(s??'').trim().toLocaleLowerCase('en');
  const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
  let state=read(KEY,null);
  if(!state||!Array.isArray(state.vocab)) state={vocab:read('toeic_vocab',[]),difficulty:read('toeic_diff',750),progress:read('toeic_progress',defaults().progress),quiz:null};
  if(!Array.isArray(state.vocab)) state.vocab=[];
  // A network request cannot survive a reload; leave the saved words intact and retry from Home.
  if(state.quiz?.loading) state.quiz=null;
  if(!state.progress||state.progress.date!==day()) state.progress=defaults().progress;
  if(!LEVELS[state.difficulty]) state.difficulty=750;
  if(!Array.isArray(state.history)) state.history=[];
  if(!state.lastLevelChangeAt) state.lastLevelChangeAt=null;
  let tab='home', busy=false, apiKey=localStorage.getItem(oldKey)||'';
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function nav(){return `<nav><button data-action="home" class="${tab==='home'?'active':''}">🏠<br>首頁</button><button data-action="words" class="${tab==='words'?'active':''}">📚<br>字庫</button><button data-action="settings" class="${tab==='settings'?'active':''}">⚙️<br>設定</button></nav>`}
  function samples(){const since=Date.parse(state.lastLevelChangeAt)||0,recent=state.history.filter(h=>Date.parse(h.at)>=since);return {newItems:recent.filter(h=>h.type==='new'&&(h.level===state.difficulty||h.challenge&&h.level===state.difficulty+50)).slice(-30),reviews:recent.filter(h=>h.type==='review').slice(-10)}}
  function home(){const p=state.progress,s=samples(),due=state.vocab.filter(v=>v.total_attempts>0&&v.next_review_at&&Date.parse(v.next_review_at)<=Date.now()).length;return `<h1>TOEIC 智慧教練</h1><section class="card"><h3>今日學習進度</h3><div class="row"><span>全新單字</span><span>${p.newWords} / 10 目標</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,p.newWords*10)}%"></div></div><div class="row"><span>舊字複習</span><span>${p.reviews} / 10 目標</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,p.reviews*10)}%;background:#22c55e"></div></div><small>目標完成後仍可繼續練習，每輪最多 10 題。</small></section><section class="card notice"><strong>目前難度 ${state.difficulty}</strong>${state.levelNotice?`<p>${esc(state.levelNotice)}</p>`:''}<p class="muted">正式升級評估：近期新字 ${s.newItems.length}/30 題、近期複習 ${s.reviews.length}/10 題。達標後依正確率升降級。</p></section><div class="grid"><button class="primary" data-action="new" ${busy?'disabled':''}>${p.newWords>=10?'再學 10 個新字':'開始新字學習'}</button><button class="green" data-action="review" ${busy?'disabled':''}>複習到期單字${due?` (${due})`:''}</button></div>${p.newWords>=10&&state.difficulty<900?`<button class="wide" data-action="challenge" ${busy?'disabled':''}>提高挑戰：${state.difficulty+50} 級，再學 10 個</button>`:''}${!apiKey?'<p class="card error">請先到設定輸入 Gemini API Key 才能產生新單字。既有字庫仍可複習。</p>':''}${state.quiz?'<button class="wide" data-action="resume">接續未完成測驗</button>':''}`}
  function options(q,type){const answer=type==='new'?q.translation:q.word, distractors=type==='new'?q.distractors_tw:q.distractors_en;return [...new Set([...distractors,answer].map(String))].sort(()=>Math.random()-.5)}
  function quiz(){let z=state.quiz;if(!z)return home();if(z.loading)return `<div class="card notice">${esc(z.loadingMessage||'AI 正在產生題庫，請稍候…')}<p class="muted">請求最多等待 30 秒；完成後會顯示題目或錯誤原因。</p></div>`;if(z.error)return `<div class="card error">${esc(z.error)}</div><button data-action="retry">返回首頁</button>`;
    const q=z.questions[z.index];if(!q){state.quiz=null;save();tab='home';return home()}
    const title=z.type==='new'?`${z.challenge?'提高挑戰':'新單字學習'}・${z.level} 級`:'情境克漏字複習',answer=z.type==='new'?q.translation:q.word;
    return `<div class="row muted"><span>${title}</span><span>${z.index+1} / ${z.questions.length}</span></div><section class="card question">${z.type==='new'?`<strong>${esc(q.word)}</strong><p class="muted">${esc(q.part_of_speech)}</p><button data-action="speak" data-speech="word">🔊 發音</button>`:`<p>${esc(q.sentence_en)}</p><button data-action="speak" data-speech="sentence">🔊 朗讀</button>`}</section>${z.options.map((o,i)=>`<button class="choice ${z.answered?(o===answer?'right':i===z.selected?'wrong':''):''}" data-action="answer" data-index="${i}" ${z.answered?'disabled':''}>${esc(o)}</button>`).join('')}${z.answered?`<section class="card notice"><strong>${z.correct?'答對了':'再記住這個字'}</strong><p>${esc(q.word)}：${esc(q.translation)}</p><p>${esc(q.sentence_en)}<br><small>${esc(q.sentence_tw)}</small></p></section><button class="primary wide" data-action="next">${z.index+1<z.questions.length?'下一題 →':'完成測驗 ✓'}</button>`:''}`;
  }
  function words(){return `<h2>我的字庫 (${state.vocab.length})</h2>${state.vocab.length?state.vocab.slice().reverse().map(v=>`<div class="card"><div class="row"><strong>${esc(v.word)}</strong><small>${v.status==='mastered'?'已掌握':'學習中'}</small></div><p>${esc(v.translation)} <small>(${esc(v.part_of_speech)})</small></p><small>正確率：${v.total_attempts?Math.round((v.correct_attempts||0)/v.total_attempts*100):0}%</small></div>`).join(''):'<p class="muted">尚未建立字庫，請先進行新字學習。</p>'}`}
  function settings(){return `<h2>系統設定</h2><section class="card"><h3>Gemini API Key</h3><p class="muted notice">出題模型：${MODEL.label} (${MODEL.id})。此靜態網頁會從你的瀏覽器直接呼叫 Google API。Key 會儲存在目前瀏覽器，使用共用裝置時請勿儲存。</p><input id="key" type="password" autocomplete="off" placeholder="AIzaSy..." value="${esc(apiKey)}"><button class="primary wide" data-action="key">儲存 Key</button><button class="wide" data-action="clearKey">清除 Key</button></section><section class="card"><h3>進度備份管理</h3><button class="wide" data-action="export">📥 匯出學習進度</button><label class="upload wide" style="display:block">📤 匯入學習進度<input id="import" type="file" accept=".json,application/json" class="hidden"></label></section><p class="muted">目前字庫：${state.vocab.length} 字｜正式難度：${esc(state.difficulty)}｜新版答題紀錄：${state.history.length} 題</p>`}
  function render(){if(state.progress.date!==day()){state.progress=defaults().progress;save()}app.innerHTML=(tab==='home'?home():tab==='quiz'?quiz():tab==='words'?words():settings())+(tab==='quiz'?'':nav())}
  function speak(s){if(!window.speechSynthesis)return;const q=state.quiz.questions[state.quiz.index];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((s==='word'?q.word:q.sentence_en).replace(/____/g,'blank'));u.lang='en-US';speechSynthesis.speak(u)}
  const validate=o=>o&&typeof o.word==='string'&&o.word.trim()&&typeof o.lemma==='string'&&o.lemma.trim()&&typeof o.translation==='string'&&o.translation.trim()&&typeof o.sentence_en==='string'&&typeof o.sentence_tw==='string'&&Array.isArray(o.distractors_tw)&&Array.isArray(o.distractors_en)&&o.distractors_tw.length===3&&o.distractors_en.length===3&&o.sentence_en.includes('____')&&o.distractors_tw.every(x=>typeof x==='string'&&x.trim()&&x!==o.translation)&&o.distractors_en.every(x=>typeof x==='string'&&x.trim()&&x!==o.word)&&new Set([...o.distractors_tw,o.translation]).size===4&&new Set([...o.distractors_en,o.word]).size===4;
  async function generate(count,level){const accepted=[],seen=new Set(state.vocab.map(v=>lemma(v.lemma))),errors=[];
    for(let attempt=0;attempt<2&&accepted.length<count;attempt++){
      state.quiz.loadingMessage=`AI 正在產生 ${level} 級題庫：${MODEL.label}${attempt?'（補足題目）':''}…`;render();
      const prompt=`你是 TOEIC 商務英文命題官。產生恰好 ${count-accepted.length} 個不同基本詞形的新字，目標難度 ${level}（練習級別，不代表實際 TOEIC 成績）。難度要求：${LEVELS[level]} 排除已學與本輪詞形：${[...seen].join(', ')}。選實用商務情境，避免同一基本詞的變形；例句自然且可判斷唯一正解。只用繁體中文。每筆含 word, lemma, part_of_speech, translation, difficulty, topic, sentence_en（挖空用 ____）, sentence_tw, distractors_tw（三個不同於正解且彼此不同的中文選項）, distractors_en（三個不同於正解且彼此不同的英文選項）。只回傳 JSON 陣列。`;
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),MODEL.timeout);
      try{const response=await fetch(`${API_BASE}${MODEL.id}:generateContent?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',thinkingConfig:{thinkingLevel:'low'}}})});
        if(!response.ok){let detail='';try{detail=(await response.json()).error?.message||''}catch{};const error=new Error(`HTTP ${response.status}${detail?': '+detail:''}`);error.status=response.status;throw error}
        const data=await response.json(),raw=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
        if(!raw)throw new Error(`AI 沒有回傳文字（${data.candidates?.[0]?.finishReason||'原因未提供'}）`);
        const items=JSON.parse(raw.replace(/```json/gi,'').replace(/```/g,'').trim());if(!Array.isArray(items))throw new Error('AI 回傳格式不是陣列');
        for(const item of items){const id=lemma(item.lemma);if(!validate(item)||!id||seen.has(id))continue;seen.add(id);accepted.push({...item,lemma:id,difficulty:level,status:'learning',correct_streak:0,total_attempts:0,correct_attempts:0,created_at:new Date().toISOString(),created_day:day()});if(accepted.length===count)break}
        if(!accepted.length)errors.push(`${MODEL.label}：回傳題目欄位不完整`);
      }catch(e){const reason=e.name==='AbortError'?`逾時（${MODEL.timeout/1000} 秒）`:e instanceof TypeError?'網路連線失敗':e.message;errors.push(`${MODEL.label}：${reason}`);if(e.status>=400&&e.status<500&&e.status!==408&&e.status!==429)break}
      finally{clearTimeout(timer)}
    }
    if(!accepted.length)throw new Error(`題庫產生失敗。${errors.join('；')||'AI 未提供有效題目'}。請稍後重試；若持續發生，請檢查 Google AI Studio 的模型存取狀態。`);return accepted;
  }
  function begin(type,questions,level=state.difficulty,challenge=false){state.quiz={type,questions,level,challenge,index:0,options:options(questions[0],type),answered:false,selected:-1};tab='quiz';save();render()}
  async function startNew(challenge=false){if(busy)return;if(state.quiz){tab='quiz';render();return}
    const pending=state.vocab.filter(v=>(v.created_day===day()||v.created_at?.slice(0,10)===day())&&v.total_attempts===0).slice(0,10);
    if(pending.length){begin('new',pending,pending[0].difficulty||state.difficulty,false);return}if(!apiKey){tab='settings';render();return}
    const level=challenge?Math.min(900,state.difficulty+50):state.difficulty;
    busy=true;state.quiz={loading:true,type:'new'};tab='quiz';render();try{const items=await generate(10,level);state.vocab.push(...items);begin('new',items,level,challenge)}catch(e){state.quiz={type:'new',error:e.message};save();render()}finally{busy=false}
  }
  function startReview(){if(state.quiz){tab='quiz';render();return}const now=Date.now(),due=state.vocab.filter(v=>v.total_attempts>0&&v.next_review_at&&Date.parse(v.next_review_at)<=now).sort((a,b)=>Date.parse(a.next_review_at)-Date.parse(b.next_review_at)).slice(0,10);if(!due.length){alert('目前沒有需要複習的單字！');return}begin('review',due)}
  function evaluateLevel(){const s=samples();if(s.newItems.length<30||s.reviews.length<10)return;
    if(state.lastLevelChangeAt&&Date.now()-Date.parse(state.lastLevelChangeAt)<3*86400000)return;
    const newRate=s.newItems.filter(h=>h.correct).length/30,reviewRate=s.reviews.filter(h=>h.correct).length/10;
    if(newRate>=.85&&reviewRate>=.75&&state.difficulty<900){state.difficulty+=50;state.lastLevelChangeAt=new Date().toISOString();state.levelNotice=`達成近期答題門檻，正式升至 ${state.difficulty} 級。`}
    else if(reviewRate<.6&&state.difficulty>750){state.difficulty-=50;state.lastLevelChangeAt=new Date().toISOString();state.levelNotice=`近期複習較吃力，調整至 ${state.difficulty} 級。`}
  }
  function answer(i){const z=state.quiz;if(!z||z.answered||!Number.isInteger(i)||i<0||i>=z.options.length)return;const q=z.questions[z.index],correct=z.options[i]===(z.type==='new'?q.translation:q.word),v=state.vocab.find(x=>lemma(x.lemma)===lemma(q.lemma));if(!v)return;
    v.total_attempts=(v.total_attempts||0)+1;v.correct_attempts=(v.correct_attempts||0)+(correct?1:0);v.correct_streak=correct?(v.correct_streak||0)+1:0;v.status=v.correct_streak>=5?'mastered':'review';const next=new Date();next.setDate(next.getDate()+(correct?[1,3,7,14,30][Math.min(v.correct_streak-1,4)]:0));v.next_review_at=next.toISOString();
    if(z.type==='new')state.progress.newWords++;else state.progress.reviews++;
    state.history.push({at:new Date().toISOString(),type:z.type,lemma:lemma(q.lemma),correct,level:z.level||state.difficulty,challenge:!!z.challenge});
    if(state.history.length>1000)state.history=state.history.slice(-1000);
    evaluateLevel();
    z.answered=true;z.selected=i;z.correct=correct;save();render();
  }
  function next(){const z=state.quiz;if(!z?.answered)return;if(z.index+1<z.questions.length){z.index++;z.options=options(z.questions[z.index],z.type);z.answered=false;z.selected=-1}else{state.quiz=null;tab='home';alert('測驗完成！')}save();render()}
  function exportData(){const blob=new Blob([JSON.stringify({schemaVersion:'3',exportedAt:new Date().toISOString(),vocabData:state.vocab,difficulty:state.difficulty,todayProgress:state.progress,history:state.history,lastLevelChangeAt:state.lastLevelChangeAt},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`TOEIC900_backup_${day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='home'||a==='words'||a==='settings'){tab=a;render()}else if(a==='new')startNew();else if(a==='challenge')startNew(true);else if(a==='review')startReview();else if(a==='resume'){tab='quiz';render()}else if(a==='retry'){state.quiz=null;tab='home';save();render()}else if(a==='answer')answer(Number(b.dataset.index));else if(a==='next')next();else if(a==='speak')speak(b.dataset.speech);else if(a==='key'){apiKey=document.getElementById('key').value.trim();localStorage.setItem(oldKey,apiKey);alert('API Key 已儲存');render()}else if(a==='clearKey'){apiKey='';localStorage.removeItem(oldKey);render()}else if(a==='export')exportData()});
  app.addEventListener('change',async e=>{if(e.target.id!=='import')return;const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.vocabData)||!d.vocabData.every(v=>v&&typeof v.word==='string'&&typeof v.lemma==='string'))throw Error();if(!confirm(`匯入 ${d.vocabData.length} 字會取代目前的字庫與進度，確定嗎？`))return;state.vocab=d.vocabData;state.difficulty=LEVELS[d.difficulty]?Number(d.difficulty):750;state.progress=d.todayProgress?.date===day()?d.todayProgress:defaults().progress;state.history=Array.isArray(d.history)?d.history.slice(-1000):[];state.lastLevelChangeAt=d.lastLevelChangeAt||null;state.levelNotice='';state.quiz=null;save();render();alert('資料匯入成功')}catch{alert('備份檔案格式錯誤')}});
  save();render();
})();
</script></body></html>
